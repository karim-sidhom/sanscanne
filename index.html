<script>
/* ===== gps-model.js — modèle GPS (acquisition + géométrie), remplace l'ancien filtre makeGpsFilter =====
   Sections « voie ferrée / ETA / alarme train » du modèle d'origine non incluses (sans objet ici). */
(function(){
/* ============================================================================
 * 1. CONSTANTES (valeurs identiques à l'application d'origine)
 * ========================================================================== */

/** Options passées à navigator.geolocation.watchPosition (index.html l.7118). */
const GPS_WATCH_OPTIONS = Object.freeze({
  enableHighAccuracy: true,
  maximumAge: 2000,
  timeout: 15000,
});

/** Rayon de danger : alarme si le train est à ≤ 150 m. */
const ALERT_DISTANCE_M = 150;
/** Fenêtre de temps de l'alarme : ETA estimé ≤ 3 min (et ≥ -1 min). */
const ALERT_ETA_MAX_MIN = 3;
const ALERT_ETA_MIN_MIN = -1;
/** Nombre de lectures consécutives cohérentes avant de verrouiller l'alarme. */
const LOCK_CONFIRM_READINGS = 3;
/** Vitesse moyenne supposée d'un train pour l'interpolation temporelle. */
const AVG_TRAIN_SPEED_KMH = 60;
/** Écart minimal (s) entre deux lectures pour calculer approche/éloignement. */
const APPROACH_MIN_DT_SEC = 3;

const EARTH_RADIUS_M = 6371000;
const TN_M_PER_DEG = 111320; // mètres par degré de latitude (approximation)
const toRad = (d) => (d * Math.PI) / 180;
const toDeg = (r) => (r * 180) / Math.PI;

/* ============================================================================
 * 2. ACQUISITION GPS
 * ========================================================================== */

/**
 * Normalise un GeolocationPosition comme le fait onPos() :
 *  - speed (m/s) -> km/h ; une vitesse nulle/absente vaut 0.
 * @returns {{pos:[number,number], lat:number, lon:number, accuracy:number,
 *            speedMps:number, speedKmh:number, timestamp:number}}
 */
function normalizeFix(position) {
  const { latitude, longitude, accuracy, speed, heading } = position.coords;
  const speedMps = speed ? speed : 0;
  return {
    pos: [latitude, longitude],
    lat: latitude,
    lon: longitude,
    accuracy,
    speedMps,
    speedKmh: speedMps * 3.6,
    heading: typeof heading === 'number' && isFinite(heading) ? heading : null,
    timestamp: position.timestamp ?? Date.now(),
  };
}

/**
 * Surveillance GPS continue (équivalent de startWatch/stopWatch + onPos, sans UI).
 *
 * @param {object}   handlers
 * @param {(fix:ReturnType<typeof normalizeFix>)=>void} handlers.onFix  appelé à chaque relevé
 * @param {(err:GeolocationPositionError)=>void}        [handlers.onError]
 * @param {Geolocation} [geo] injectable pour les tests (défaut : navigator.geolocation)
 */
function createGpsWatcher({ onFix, onError }, geo = globalThis.navigator?.geolocation) {
  let watchId = null;
  let last = null;
  return {
    start() {
      if (!geo) throw new Error('Géolocalisation non supportée');
      if (watchId !== null) return;
      watchId = geo.watchPosition(
        (p) => {
          last = normalizeFix(p);
          onFix(last);
        },
        (e) => onError && onError(e),
        GPS_WATCH_OPTIONS
      );
    },
    stop() {
      if (watchId !== null && geo) geo.clearWatch(watchId);
      watchId = null;
    },
    /** Dernière position connue (équivalent de la globale `lastPos`). */
    get last() {
      return last;
    },
    get active() {
      return watchId !== null;
    },
  };
}

/* ============================================================================
 * 3. GÉOMÉTRIE
 * ========================================================================== */

/** Distance sphérique (haversine) en mètres entre deux points [lat,lon]. */
function haversine(a, b) {
  const dLat = toRad(b[0] - a[0]);
  const dLon = toRad(b[1] - a[1]);
  const s =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * EARTH_RADIUS_M * Math.asin(Math.sqrt(s));
}

/**
 * Paramètre t∈[0,1] de la projection planaire de p sur le segment [a,b].
 * (approximation plane, valable pour de petites distances).
 */
function projectT(p, a, b) {
  const ax = a[1], ay = a[0], bx = b[1], by = b[0], px = p[1], py = p[0];
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return 0;
  const t = ((px - ax) * dx + (py - ay) * dy) / len2;
  return Math.max(0, Math.min(1, t));
}

/** Point situé à distM mètres de [lat,lon] dans la direction bearingDeg (formule sphérique). */
function destinationPoint(lat, lon, bearingDeg, distM) {
  const br = toRad(bearingDeg);
  const lat1 = toRad(lat), lon1 = toRad(lon);
  const d = distM / EARTH_RADIUS_M;
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(br));
  const lon2 =
    lon1 +
    Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
  return [toDeg(lat2), ((toDeg(lon2) + 540) % 360) - 180];
}

/** Cap (bearing) initial de a vers b, en degrés [0,360[. */
function bearingBetween(a, b) {
  const y = Math.sin(toRad(b[1] - a[1])) * Math.cos(toRad(b[0]));
  const x =
    Math.cos(toRad(a[0])) * Math.sin(toRad(b[0])) -
    Math.sin(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.cos(toRad(b[1] - a[1]));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/**
 * Métrique équirectangulaire « Tunisie » (haversineTN) : très rapide, précise à l'échelle
 * du pays. La latitude de référence est recalibrée sur la moyenne réelle des points du réseau.
 * @param {Array<{pts:number[][]}>} [railLines]  sert uniquement à calibrer la latitude de référence
 * @returns {(a:number[], b:number[])=>number} distance en mètres
 */
function createTNMetric(railLines) {
  let refLatRad = toRad(33.5); // valeur de repli de l'application d'origine
  if (railLines && railLines.length) {
    let sum = 0, n = 0;
    for (const line of railLines) for (const p of line.pts) { sum += p[0]; n++; }
    if (n > 0) refLatRad = toRad(sum / n);
  }
  const cosRef = Math.cos(refLatRad);
  return function haversineTN(a, b) {
    const dLat = (b[0] - a[0]) * TN_M_PER_DEG;
    const dLon = (b[1] - a[1]) * TN_M_PER_DEG * cosRef;
    return Math.sqrt(dLat * dLat + dLon * dLon);
  };
}

window.GpsModel = {
  GPS_WATCH_OPTIONS, normalizeFix, createGpsWatcher,
  haversine, projectT, destinationPoint, bearingBetween, createTNMetric
};
})();
</script>
<script>
/* ===== 🦯 Alerte trottoir pour personnes non voyantes =====

  vb.onclick=function(){ visOn=!visOn; vb.style.outline=visOn?'3px solid #fff':''; vb.setAttribute('aria-pressed',visOn?'true':'false'); vb.setAttribute('aria-label','Zones vertes et rouges : '+(visOn?'affichées':'masquées')); if(visOn){ lg.addTo(map); resize(); loadView(); } else map.removeLayer(lg); };
  var db=document.createElement('button'); db.id='safeDl'; db.type='button'; db.textContent='📥'; db.title='Télécharger les rues autour de moi (une seule fois)'; db.setAttribute('aria-label','Télécharger les rues du quartier, une seule fois');
  btn.parentNode.insertBefore(db,vb.nextSibling);

  var fb=document.createElement('button'); fb.id='safeImp'; fb.type='button'; fb.textContent='📂'; fb.title='Charger un fichier de rues (Geofabrik)'; fb.setAttribute('aria-label','Charger un fichier de rues Geofabrik');
  var fi=document.createElement('input'); fi.type='file'; fi.accept='.json,application/json'; fi.style.display='none'; document.body.appendChild(fi);

  var lb=document.createElement('button'); lb.id='safeLoc'; lb.type='button'; lb.textContent='📍'; lb.title='Ma position / موقعي'; lb.setAttribute('aria-label','Centrer la carte sur ma position');

  lb.parentNode.insertBefore(pb,lb.nextSibling); pb.onclick=function(){ pi.click(); };
  pi.onchange=function(){ var f=pi.files[0]; if(!f) return; var im=new Image(), u=URL.createObjectURL(f);
    im.onload=function(){ var c=document.createElement('canvas'); var m=Math.min(im.width,im.height); c.width=c.height=64; c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,64,64);
      photo=c.toDataURL('image/jpeg',.8); try{ localStorage.setItem('safePhoto',photo); }catch(e){} URL.revokeObjectURL(u); if(mk) mk.setIcon(mkIcon()); say('✅ Photo enregistrée',3000); };
    im.onerror=function(){ say('⚠️ Image illisible',3000); }; im.src=u; pi.value=''; };
  var toast=document.createElement('div');
  toast.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top));z-index:3600;background:#0d1a6eF2;color:#fff;border:1px solid #d4af37;border-radius:12px;padding:8px 14px;font-size:13px;max-width:calc(100vw - 32px);text-align:center;display:none';
  document.body.appendChild(toast); var tt=null;
  var lastMsg='', V='v9';
  var info_=document.createElement('div'); info_.id='safeInfo';
  info_.style.cssText='position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3600;background:#000c;color:#fff;font:700 12px system-ui,sans-serif;padding:6px 10px;border-radius:10px;pointer-events:none;max-width:70vw';
  document.body.appendChild(info_);
  function info(){ var z=map.getZoom(), n=0, ok=0, pd=Object.keys(pending).length, fl=0; for(var k in cells){ if(cells[k]&&cells[k].d){ n+=cells[k].d.ways.length; ok++; } else if(cells[k]&&cells[k].fail) fl++; }
    info_.textContent='🦯 '+V+' · zoom '+z+' · '+n+' rues · '+ok+' zones'+(pd?' · ⏳'+pd:'')+(fl&&!pd?' · ❌ réseau':'')+(gpsErr?' · ⚠️ '+gpsErr:(!rawT?' · 📡 recherche du GPS…':''))+(stepTxt?' · '+stepTxt:'')+(dl.on?' · 📥 '+dl.done+'/'+dl.total:'')+(z<14?' · ⚠️ zoomez à 14 ou plus':'')+(me?' · '+me.lat.toFixed(5)+', '+me.lon.toFixed(5)+' · GPS ±'+Math.round(me.est||rawAcc)+' m · '+Math.round((me.spd||0)*3.6)+' km/h (max 7)':''); }

  function say(t,ms){ toast.textContent=t; toast.style.display='block'; clearTimeout(tt); tt=setTimeout(function(){toast.style.display='none';},ms||3500);
    var live=document.getElementById('a11yLive'); if(live) live.textContent=t; }
  var lastVoice={};
  /* soft : annonce d'état, jamais répétée dans les 12 s et jamais empilée sur une autre voix ; urgent : coupe la voix en cours (panne GPS) ; __ok : sinon la page bloque la voix */
  function speak(t,soft,urgent){ try{ var ss=window.speechSynthesis; if(!ss) return; var now=Date.now();
    if(soft){ if(ss.speaking||ss.pending) return; if(lastVoice[t]&&now-lastVoice[t]<12000) return; lastVoice[t]=now; }
    if(urgent) ss.cancel();
    var u=new SpeechSynthesisUtterance(t); u.__ok=true; u.lang='fr-FR'; ss.speak(u); }catch(e){} }

  /* ---------- géométrie (mètres, repère local autour du centre de chargement) ---------- */
  function proj(c,la,lo){ return {x:(lo-c.lon)*111320*Math.cos(c.lat*Math.PI/180), y:(la-c.lat)*111320}; }
  function ptSeg(px,py,a,b){ var dx=b.x-a.x, dy=b.y-a.y, l=dx*dx+dy*dy, t=l?Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/l)):0, x=a.x+t*dx-px, y=a.y+t*dy-py; return Math.sqrt(x*x+y*y); }

  /* ---------- chargement des rues (OpenStreetMap / Overpass) : petites zones, en parallèle, avec mémoire ---------- */
  var rot=0, BAD=/^(footway|path|steps|cycleway|pedestrian|corridor|bridleway|elevator|proximity|construction|raceway|platform)$/;
  /* 2e source, autre infrastructure que Overpass : l'API principale d'OpenStreetMap (CORS ouvert) */

    /* on interroge plusieurs serveurs en même temps : le premier qui répond gagne */

      eps.forEach(function(ep){

        if(state==='green'){ var G=Math.max(GREEN_M,Math.min(6,(me&&me.est)||GREEN_M)), f=1-Math.max(0,Math.min(1,dEdge/G)); beep(600+300*f,0.09); next=1000-700*f; }
        else if(state==='red'){ beep(1500,0.05); next=100; }
        else { beep(500,0.06); next=1200; }
      }
    }catch(e){ next=500; }
    timer=setTimeout(tick,next);
  }
  /* garde-fou : si le navigateur a endormi l'audio ou la boucle des bips, on les relance */
  setInterval(function(){ if(!on) return; resumeAudio(); wakeOn(); if(Date.now()-lastTick>3500){ clearTimeout(timer); tick(); } },1500);
  document.addEventListener('visibilitychange',function(){ if(!on) return; resumeAudio(); wakeOn(); if(Date.now()-lastTick>2500){ clearTimeout(timer); tick(); } });

  /* ---------- activation ---------- */
  function setOn(v){
    on=v; btn.setAttribute('aria-pressed',v?'true':'false'); btn.style.outline=v?'3px solid #fff':'';
    btn.setAttribute('aria-label','Alerte trottoir : '+(v?'activée':'désactivée'));
    if(v){
      try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
      try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.onstatechange=function(){ if(on) resumeAudio(); }; resumeAudio(); keepAlive(); }catch(e){}
      wakeOn();
      if(!navigator.geolocation){ say('⚠️ Géolocalisation non supportée',4000); return; }
      onSince=Date.now(); readySaid=false; errSaid=0;
      startGeo();
      say('🦯 Alerte activée — 🟢 bip lent : hors chaussée — 🔴 bip rapide : chaussée',5000); speak('Alerte trottoir activée. Vitesse maximale : 7 kilomètres par heure. Marchez à pied, pas trop vite.');
      clearTimeout(timer); tick(); if(me){ map.setView([me.lat,me.lon],Math.max(map.getZoom(),18)); loadUser(); }
    } else {
      clearTimeout(timer); state='none'; wakeOff(); try{ if(ka){ ka.stop(); ka=null; } }catch(e){} say('🦯 Alerte désactivée',2500); speak('Alerte trottoir désactivée');
    }
  }
  btn.onclick=function(){ setOn(!on); };
  window.safeZones={signed:signed,state:function(){return state;}};
})();
</script>
